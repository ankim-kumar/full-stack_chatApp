apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
    spec:
      containers:
      - name: chatapp-frontend
        image: ankim628/chatgitfrontend:${IMAGE_TAG}
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: production
