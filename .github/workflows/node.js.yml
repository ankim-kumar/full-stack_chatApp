name: Node.js CICD

on:
  push:
    branches: ["prod"]  

jobs: 
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Frontend Compilation (Syntax Check)
        run: |
          cd frontend
          find . -name "*.js" -exec node --check {} \;

      - name: Backend Compilation (Syntax Check)
        run: |
          cd backend
          find . -name "*.js" -exec node --check {} \;

  gitleaks-scan:
    runs-on: self-hosted
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks Setup
        uses: gitleaks/gitleaks-action@v2

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source ./frontend --exclude-path k8s/secrets.yml --exit-code 1
          gitleaks detect --source ./backend --exclude-path k8s/secrets.yml --exit-code 1

  trivy_fs_scan:
    runs-on: self-hosted
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    outputs:
      image_tag: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ankim628/chatgitbackendgcp:${{ github.run_number }}

  build_frontend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    outputs:
      image_tag: ${{ github.run_number }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ankim628/chatgitfrontend:${{ github.run_number }}

  deploy-gke:
    runs-on: self-hosted
    needs:
      - build_backend_docker_image_and_push
      - build_frontend_docker_image_and_push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_REGION }}

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yml

      - name: Apply Kubernetes Secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          envsubst < k8s/secrets.yml | kubectl apply -f -
     
      - name: Deploy MongoDB
        run: |
          kubectl apply -f k8s/mongodb-pvc.yml
          kubectl apply -f k8s/mongodb-deployment.yml
          kubectl apply -f k8s/mongodb-service.yml
      
      - name: Deploy Backend Blue–Green
        env:
          IMAGE_TAG: ${{ needs.build_backend_docker_image_and_push.outputs.image_tag }}
        run: |
        
          kubectl apply -f k8s/backend-service.yml
          kubectl apply -f k8s/backend-deployment.yml          
          envsubst < k8s/backend-green.yml | kubectl apply -f -
          
          kubectl rollout status deployment/backend-green \
            -n chat-app --timeout=300s
        
          kubectl patch svc backend \
            -n chat-app \
            -p '{"spec":{"selector":{"app":"backend","version":"green"}}}'
  
      - name: Deploy Frontend Blue–Green
        env:
          IMAGE_TAG: ${{ needs.build_frontend_docker_image_and_push.outputs.image_tag }}
        run: |
          kubectl apply -f k8s/frontend-service.yml
          kubectl apply -f k8s/frontend-deployment.yml
          envsubst < k8s/frontend-green.yml | kubectl apply -f -

          kubectl rollout status deployment/frontend-green \
            -n chat-app --timeout=300s

          kubectl patch svc frontend \
            -n chat-app \
            -p '{"spec":{"selector":{"app":"frontend","version":"green"}}}'
      
